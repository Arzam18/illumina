
name: Build Illumina Android Binary

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Compile Illumina for Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize SQLiteCpp
        run: |
          git submodule update --init --depth=1 ext/SQLiteCpp
          test -f ext/SQLiteCpp/CMakeLists.txt

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Fix Missing Stringstream Include
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("cli/state.cpp")

          if not p.is_file():
              raise SystemExit("ERROR: cli/state.cpp was not found")

          source = p.read_text()

          if "#include <sstream>" not in source:
              source = "#include <sstream>\n" + source
              p.write_text(source)

          if "#include <sstream>" not in p.read_text():
              raise SystemExit("ERROR: Failed to add <sstream>")

          print("Verified <sstream> in cli/state.cpp")
          PY

          echo "=== Confirming header location ==="
          grep -n '#include <sstream>' cli/state.cpp

      - name: Verify ARM64 SIMD Source
        run: |
          echo "=== SIMD-related source files ==="
          find illumina ext -type f \
            \( -name 'simd.h' -o -name 'sse2neon.h' \) \
            -print

          echo "=== SIMD configuration references ==="
          grep -R -n -E 'arm64_neon|sse2neon|#define NEON|__ARM_NEON' \
            CMakeLists.txt illumina ext/include \
            --include='*.cmake' \
            --include='CMakeLists.txt' \
            --include='*.h' \
            --include='*.cpp' || true

      - name: Configure CMake for Android ARM64
        run: |
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"

          test -f "$NDK/build/cmake/android.toolchain.cmake"

          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEVELOPMENT=OFF

      - name: Inspect SIMD Configuration
        run: |
          echo "=== NEON compile definitions and flags ==="
          grep -n -E 'arm64_neon|NEON|sse2neon|march=' \
            build/build.ninja 2>/dev/null || true

      - name: Build Android ARM64 Engine Only
        run: |
          cmake --build build \
            --target illumina_cli_arm64_neon \
            --parallel 2

      - name: Locate and Verify Executable
        run: |
          set -eu
          mkdir -p output

          BIN="build/cli/illumina_4_arm64_neon_android_64-bit"

          if [ ! -f "$BIN" ]; then
            echo "::error::Android ARM64 engine executable not found."
            echo "Searching for available engine executables:"
            find build/cli -maxdepth 1 -type f -print
            exit 1
          fi

          cp "$BIN" output/illumina_android_arm64
          chmod +x output/illumina_android_arm64

          echo "=== Binary file information ==="
          file output/illumina_android_arm64

          echo "=== Verify ARM64 ELF architecture ==="
          readelf -h output/illumina_android_arm64

          echo "=== Verify NEON build configuration ==="
          grep -n -E 'NEON|arm64_neon' build/build.ninja | head -20 || true

      - name: Upload Android ARM64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: illumina-android-arm64
          path: output/illumina_android_arm64
          retention-days: 14
