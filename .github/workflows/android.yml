name: Build Illumina Android Binary

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Illumina for Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Adjust CMakeLists and Patch x86-only Headers for ARM64
        run: |
          # Restrict ARCHS to 'base' to avoid x86-specific compiler flags (-mavx2, -mbmi2)
          sed -i 's/set(ARCHS bmi2 avx2 base)/set(ARCHS base)/g' CMakeLists.txt

          # Use Python to safely guard unconditional <cpuid.h> and <immintrin.h> inclusions for non-x86 targets
          python3 - <<EOF
          import glob

          files = glob.glob("illumina/**/*.h", recursive=True) + glob.glob("illumina/**/*.cpp", recursive=True)
          for filepath in files:
              with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              
              modified = False
              if "#include <cpuid.h>" in content:
                  content = content.replace(
                      "#include <cpuid.h>",
                      "#if defined(__x86_64__) || defined(_M_X64) || defined(__i386__) || defined(_M_IX86)\n#include <cpuid.h>\n#endif"
                  )
                  modified = True
              
              if "#include <immintrin.h>" in content:
                  content = content.replace(
                      "#include <immintrin.h>",
                      "#if defined(__x86_64__) || defined(_M_X64) || defined(__i386__) || defined(_M_IX86)\n#include <immintrin.h>\n#endif"
                  )
                  modified = True
              
              if modified:
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Patched header guards in {filepath}")
          EOF

      - name: Configure CMake for Android
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEVELOPMENT=OFF

      - name: Build Executable
        run: |
          cmake --build build --config Release -j$(nproc)

      - name: Locate and Prepare Artifact
        run: |
          mkdir -p output
          echo "Searching for compiled binaries in build directory:"
          find build -type f
          
          # Find any file named 'illumina' (excluding object files, archives, and cmake files) and copy it
          find build -name "illumina" -type f -not -name "*.o" -not -name "*.a" -not -name "*.cmake" -exec cp {} output/illumina_android_arm64 \;
          
          # Fallback if target name has an extension or slightly different casing
          if [ ! -f output/illumina_android_arm64 ]; then
            find build -name "illumina*" -type f -not -name "*.o" -not -name "*.a" -not -name "*.cmake" -exec cp {} output/illumina_android_arm64 \;
          fi
          
          chmod +x output/illumina_android_arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: illumina-android-arm64
          path: output/illumina_android_arm64
          retention-days: 14
