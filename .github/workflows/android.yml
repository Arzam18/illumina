
name: Build Illumina Android Binary

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Compile Illumina for Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize SQLiteCpp
        run: |
          git submodule update --init --depth=1 ext/SQLiteCpp
          test -f ext/SQLiteCpp/CMakeLists.txt

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      # Fix the missing standard header for std::stringstream.
      - name: Fix Missing Stringstream Include
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("cli/state.cpp")
          if not p.is_file():
              raise SystemExit("ERROR: cli/state.cpp was not found")

          source = p.read_text()

          if "#include <sstream>" not in source:
              lines = source.splitlines(keepends=True)

              # Insert after the existing include block.
              include_positions = [
                  i for i, line in enumerate(lines)
                  if line.lstrip().startswith("#include ")
              ]

              if include_positions:
                  pos = max(include_positions) + 1
                  lines.insert(pos, "#include <sstream>\n")
              else:
                  lines.insert(0, "#include <sstream>\n")

              p.write_text("".join(lines))

          print("Verified <sstream> in cli/state.cpp")
          PY

      - name: Verify ARM64 SIMD Source
        run: |
          echo "=== SIMD-related source files ==="
          find illumina ext -type f \
            \( -name 'simd.h' -o -name 'sse2neon.h' \) \
            -print

          echo "=== SIMD configuration references ==="
          grep -R -n -E 'arm64_neon|sse2neon|#define NEON|__ARM_NEON' \
            CMakeLists.txt illumina ext/include \
            --include='*.cmake' \
            --include='CMakeLists.txt' \
            --include='*.h' \
            --include='*.cpp' || true

      - name: Configure CMake for Android ARM64
        run: |
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"

          test -f "$NDK/build/cmake/android.toolchain.cmake"

          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDEVELOPMENT=OFF

      - name: Inspect SIMD Configuration
        run: |
          echo "=== NEON compile definitions and flags ==="
          grep -n -E 'arm64_neon|NEON|sse2neon|march=' \
            build/build.ninja 2>/dev/null || true

      - name: Build Executable
        run: |
          cmake --build build --parallel 2

      - name: Locate and Verify Executable
        run: |
          set -eu
          mkdir -p output

          echo "=== Candidate executables ==="
          find build -type f -executable -print

          BIN="$(find build -type f -name illumina \
            -executable -print -quit)"

          if [ -z "$BIN" ]; then
            echo "::error::Could not find the illumina executable."
            echo "Check the CMake target name and build output."
            exit 1
          fi

          cp "$BIN" output/illumina_android_arm64
          chmod +x output/illumina_android_arm64

          echo "=== Binary file information ==="
          file output/illumina_android_arm64

          echo "=== ELF header ==="
          readelf -h output/illumina_android_arm64

          echo "=== Program headers ==="
          readelf -l output/illumina_android_arm64

      - name: Upload Android ARM64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: illumina-android-arm64
          path: output/illumina_android_arm64
          retention-days: 14
